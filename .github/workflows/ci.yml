name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        # Sandbox tests run nightly only. Exit code 8 = "zero tests ran" (the sandbox project is filtered out).
        run: >
          dotnet test -c Release --no-build
          --filter-not-trait "Category=Sandbox"
          --ignore-exit-code 8
          --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack eng/PayGate.Packages.slnf -c Release --no-build -o artifacts/packages

      - name: Consumer compile check
        shell: pwsh
        run: ./eng/consumer-check.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
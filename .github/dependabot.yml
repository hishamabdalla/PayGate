version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      test-stack:
        patterns: ['xunit*', 'Microsoft.Testing.*', 'Shouldly', 'NSubstitute']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly